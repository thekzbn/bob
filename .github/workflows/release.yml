name: Release and Publish npm Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build macOS (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Bob compiler
        run: |
          mkdir -p bin
          clang -Wall -Wextra -std=c11 -O2 \
            src/lexer.c src/ast.c src/parser.c src/meta.c src/id_gen.c src/codegen.c src/main.c \
            -o bin/bobc-darwin-arm64
          chmod +x bin/bobc-darwin-arm64
          ./bin/bobc-darwin-arm64 --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobc-darwin-arm64
          path: bin/bobc-darwin-arm64

  build-macos-x64:
    name: Build macOS (x64)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Bob compiler
        run: |
          mkdir -p bin
          clang -Wall -Wextra -std=c11 -O2 \
            src/lexer.c src/ast.c src/parser.c src/meta.c src/id_gen.c src/codegen.c src/main.c \
            -o bin/bobc-darwin-x64
          chmod +x bin/bobc-darwin-x64
          ./bin/bobc-darwin-x64 --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobc-darwin-x64
          path: bin/bobc-darwin-x64

  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Bob compiler
        run: |
          mkdir -p bin
          gcc -Wall -Wextra -std=c11 -O2 \
            src/lexer.c src/ast.c src/parser.c src/meta.c src/id_gen.c src/codegen.c src/main.c \
            -o bin/bobc-linux-x64
          chmod +x bin/bobc-linux-x64
          ./bin/bobc-linux-x64 --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobc-linux-x64
          path: bin/bobc-linux-x64

  build-linux-arm64:
    name: Build Linux (ARM64 Cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile Bob compiler
        run: |
          mkdir -p bin
          aarch64-linux-gnu-gcc -Wall -Wextra -std=c11 -O2 \
            src/lexer.c src/ast.c src/parser.c src/meta.c src/id_gen.c src/codegen.c src/main.c \
            -o bin/bobc-linux-arm64
          chmod +x bin/bobc-linux-arm64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobc-linux-arm64
          path: bin/bobc-linux-arm64

  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Bob compiler
        shell: bash
        run: |
          mkdir -p bin
          gcc -Wall -Wextra -std=c11 -O2 \
            src/lexer.c src/ast.c src/parser.c src/meta.c src/id_gen.c src/codegen.c src/main.c \
            -o bin/bobc-win32-x64.exe
          ./bin/bobc-win32-x64.exe --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobc-win32-x64.exe
          path: bin/bobc-win32-x64.exe

  publish:
    name: Package Binaries & Publish npm
    needs:
      - build-macos-arm64
      - build-macos-x64
      - build-linux-x64
      - build-linux-arm64
      - build-windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Create npm bin directory
        run: mkdir -p npm/bin

      - name: Download macOS ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: bobc-darwin-arm64
          path: npm/bin

      - name: Download macOS x64 binary
        uses: actions/download-artifact@v4
        with:
          name: bobc-darwin-x64
          path: npm/bin

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v4
        with:
          name: bobc-linux-x64
          path: npm/bin

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: bobc-linux-arm64
          path: npm/bin

      - name: Download Windows x64 binary
        uses: actions/download-artifact@v4
        with:
          name: bobc-win32-x64.exe
          path: npm/bin

      - name: Make Unix binaries executable & verify package contents
        run: |
          chmod +x npm/bin/bobc-darwin-arm64
          chmod +x npm/bin/bobc-darwin-x64
          chmod +x npm/bin/bobc-linux-x64
          chmod +x npm/bin/bobc-linux-arm64
          ls -la npm/bin

      - name: Verify local execution on runner
        run: |
          node npm/index.js --version

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with downloadable assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            npm/bin/bobc-darwin-arm64
            npm/bin/bobc-darwin-x64
            npm/bin/bobc-linux-x64
            npm/bin/bobc-linux-arm64
            npm/bin/bobc-win32-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
